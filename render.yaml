services:
  - type: web
    name: nafiz-ahmed12s
    runtime: python
    branch: main
    autoDeployTrigger: commit
    region: singapore
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/migrate.py
    startCommand: gunicorn app:app
    healthCheckPath: /health/ready
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nafiz-ahmed12s-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: BASE_DOMAIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: SSLCOMMERZ_SANDBOX
        value: "1"
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: MAX_CONTENT_LENGTH
        value: "1048576"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "1800"

databases:
  - name: nafiz-ahmed12s-db
    region: singapore
    plan: free
    postgresMajorVersion: "18"
    databaseName: nafiz
    user: nafiz
