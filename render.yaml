services:
  - type: web
    name: nafiz-ahmed12s
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/migrate.py && gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
