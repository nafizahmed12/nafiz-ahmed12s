<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ brand }} Phones: Specs, Prices & Reviews</title><meta name="description" content="Explore {{ brand }} phones, specifications, prices, release information and comparisons."><link rel="canonical" href="{{ request.base_url }}"></head><body style="font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:24px"><nav><a href="/phones">All Phones</a> · <a href="/blog">Blog</a> · <a href="/shop">Shop</a></nav><h1>{{ brand }} Phones</h1><p>Browse published {{ brand }} phone information, specifications and useful comparisons.</p>{% for phone in phones %}<article style="border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0"><h2><a href="{{ url_for('phone_catalog.phone_catalog_detail',brand=phone.brand|lower|replace(' ','-'),slug=phone.slug) }}">{{ phone.model }}</a></h2><p>{{ phone.short_description }}</p></article>{% endfor %}</body></html>
