<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nafiz Store — Shop & Checkout</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050816;color:#eef2ff;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.brand{font-size:24px;font-weight:800}.brand span{color:#7c5cff}.nav{display:flex;gap:10px}.btn{border:0;border-radius:12px;padding:12px 18px;background:#171d32;color:#fff;text-decoration:none;cursor:pointer;font-weight:700}.primary{background:linear-gradient(135deg,#7c5cff,#00c2ff)}.hero{padding:42px 0}.eyebrow{font-size:12px;letter-spacing:2px;color:#7c9cff}.hero h1{font-size:clamp(38px,7vw,72px);line-height:.98;margin:12px 0}.hero p{max-width:680px;color:#aab3cc;font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,.checkout{background:rgba(15,22,42,.82);border:1px solid #242d48;border-radius:22px;padding:20px;box-shadow:0 20px 50px #0005}.thumb{height:190px;border-radius:16px;background:linear-gradient(135deg,#151d38,#202b55);display:grid;place-items:center;color:#7c9cff;font-size:42px;font-weight:900;margin-bottom:18px}.card h3{margin:0 0 8px}.muted{color:#9ca7c2}.price{font-size:24px;font-weight:800;margin:15px 0}.checkout{margin-top:28px;display:none}.checkout.show{display:block}.rows{display:grid;gap:10px}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #252d45}.paybox{margin-top:20px;padding:18px;border:1px solid #303b5e;border-radius:16px}.empty{text-align:center;padding:45px;color:#9ca7c2;grid-column:1/-1}.notice{margin:15px 0;padding:14px;border-radius:12px;background:#111a30;color:#b9c6e8;display:none}.notice.show{display:block}.total{font-size:28px;font-weight:900}.back{margin-top:18px;display:inline-block;color:#9eb2ff;cursor:pointer}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.top{align-items:flex-start}.grid{grid-template-columns:1fr}.nav{flex-direction:column}.hero{padding:20px 0}}
</style></head>
<body>
<div class="wrap">
<header class="top"><div class="brand">Nafiz<span>.</span> Store</div><div class="nav"><a class="btn" href="/">Home</a><a class="btn" href="/user-login">Account</a><button class="btn" onclick="loadCart()">Cart (<span id="count">0</span>)</button></div></header>
<section class="hero"><div class="eyebrow">NAFIZ COMMERCE</div><h1>Shop. Checkout.<br><span style="color:#7c9cff">Pay securely.</span></h1><p>Products, cart, checkout and hosted SSLCommerz payment are now connected to the real backend.</p></section>
<div id="notice" class="notice"></div>
<section id="products" class="grid"></section>
<section id="checkout" class="checkout">
<h2>Checkout</h2><div id="checkoutRows" class="rows"></div><div class="row"><span>Subtotal</span><strong id="subtotal">৳0.00</strong></div><div class="row"><span>Total</span><strong id="total" class="total">৳0.00</strong></div>
<div class="paybox"><h3>Payment</h3><p class="muted">You will be securely redirected to SSLCommerz to complete payment.</p><button class="btn primary" id="payBtn" onclick="payNow()">Pay Now with SSLCommerz →</button></div>
<a class="back" onclick="showProducts()">← Continue shopping</a>
</section>
</div>
<script>
const $=id=>document.getElementById(id);let checkoutId=null,orderId=null;
function notice(msg){$('notice').textContent=msg;$('notice').classList.add('show');setTimeout(()=>$('notice').classList.remove('show'),5000)}
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const data=await r.json().catch(()=>({error:'Server returned an invalid response.'}));if(!r.ok)throw new Error(data.error||'Request failed');return data}
async function loadProducts(){try{const d=await api('/api/products');const el=$('products');if(!d.items.length){el.innerHTML='<div class="empty">No published products yet. Add products from your commerce/admin system and they will appear here.</div>';return}el.innerHTML=d.items.map(p=>`<article class="card"><div class="thumb">${p.product_type==='digital'?'DIGITAL':'SHOP'}</div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.description||'Premium product')}</p><div class="price">৳${p.price}</div><button class="btn primary" onclick="add(${p.id})">Add to Cart</button></article>`).join('')}catch(e){notice(e.message)}}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function add(id){try{const d=await api('/api/cart/items',{method:'POST',body:JSON.stringify({product_id:id,quantity:1})});$('count').textContent=d.item_count;notice('Added to cart.');}catch(e){notice(e.message);if(e.message==='Authentication required.')location.href='/user-login'}}
async function loadCart(){try{const d=await api('/api/cart');$('count').textContent=d.item_count;if(!d.items.length){notice('Your cart is empty.');return}const c=await api('/api/checkout',{method:'POST'});checkoutId=c.checkout_id;showCheckout(c);notice('Checkout created. Review your order before paying.')}catch(e){notice(e.message);if(e.message==='Authentication required.')location.href='/user-login'}}
function showCheckout(c){$('products').style.display='none';$('checkout').classList.add('show');$('checkoutRows').innerHTML='<div class="row"><span>Checkout #'+c.checkout_id+'</span><span>'+c.status+'</span></div>';$('subtotal').textContent='৳'+c.subtotal;$('total').textContent='৳'+c.total_amount}
function showProducts(){$('products').style.display='grid';$('checkout').classList.remove('show')}
async function payNow(){if(!checkoutId)return notice('Create checkout first.');const b=$('payBtn');b.disabled=true;b.textContent='Preparing secure payment…';try{const o=await api('/api/checkout/'+checkoutId+'/place-order',{method:'POST'});orderId=o.order_id;const p=await api('/api/orders/'+orderId+'/payments/sslcommerz/initiate',{method:'POST'});if(!p.gateway_page_url)throw new Error('Payment gateway URL was not returned.');location.href=p.gateway_page_url}catch(e){notice(e.message);b.disabled=false;b.textContent='Pay Now with SSLCommerz →'}}
loadProducts();
</script></body></html>
