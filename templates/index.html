<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ phone.name }} Price in BD - Nafiz Ecommerce</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #20e382;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .product-image-box {
            background: radial-gradient(circle at center, #2a3749 0%, #151d2a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        .product-icon {
            font-size: 140px;
            color: var(--accent-color);
            filter: drop-shadow(0 10px 20px rgba(32, 227, 130, 0.2));
        }

        .badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(32, 227, 130, 0.15);
            color: var(--accent-color);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            text-transform: uppercase;
        }

        .product-details {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .back-link {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--accent-color);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .price-tag {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .price-label {
            font-size: 14px;
            color: var(--text-sub);
        }

        .price-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .description {
            color: var(--text-sub);
            line-height: 1.7;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent-color);
            color: #000;
        }

        .btn-primary:hover {
            background: #1bc46f;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(32, 227, 130, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- প্রোডাক্ট ইমেজ বক্স -->
        <div class="product-image-box">
            <span class="badge">In Stock</span>
            <i class="fa-solid fa-mobile-screen-button product-icon"></i>
        </div>

        <!-- প্রোডাক্ট ডিটেইলস -->
        <div class="product-details">
            <a href="/shop" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Shop</a>
            
            <h1>{{ phone.name }}</h1>

            <div class="price-tag">
                <span class="price-label">Price:</span>
                <span class="price-value">{{ phone.price }} BDT</span>
            </div>

            <p class="description">
                {{ phone.details }}
            </p>

            <div class="actions">
                <a href="#" class="btn btn-primary"><i class="fa-solid fa-bag-shopping"></i> Buy Now</a>
                <a href="/shop" class="btn btn-secondary"><i class="fa-solid fa-store"></i> Browse More</a>
            </div>
        </div>
    </div>

</body>
</html>
