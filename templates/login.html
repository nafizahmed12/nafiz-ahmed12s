<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#312e81,#0f172a 60%);color:white}
.login-box{width:380px;padding:40px;background:#1e293b;border:1px solid #334155;border-radius:15px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
h1{text-align:center;color:#38bdf8;margin-bottom:30px}
label{display:block;margin-bottom:8px;color:#cbd5e1}
input{width:100%;padding:13px;margin-bottom:20px;background:#0f172a;color:white;border:1px solid #334155;border-radius:8px;outline:none}
input:focus{border-color:#38bdf8}
button{width:100%;padding:14px;border:none;border-radius:8px;background:#38bdf8;color:#0f172a;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{background:#facc15}
.forgot{display:block;text-align:center;margin-top:18px;color:#7dd3fc;text-decoration:none}
.forgot:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="login-box">
<h1>Admin Login</h1>
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Username</label>
<input type="text" name="username" placeholder="Enter username" autocomplete="username" required>
<label>Password</label>
<input type="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
<button type="submit">Login</button>
</form>
<a class="forgot" href="{{ url_for('admin_forgot_password') }}">Forgot Admin Password?</a>
</div>
</body>
</html>
