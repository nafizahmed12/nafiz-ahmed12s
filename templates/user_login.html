<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login — Nafiz Ahmed</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-wrap{max-width:540px;margin:70px auto;padding:34px}.auth-wrap form{display:grid;gap:14px}.auth-wrap input{width:100%;box-sizing:border-box}.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}.flash{padding:12px 14px;border-radius:12px;margin-bottom:16px;background:rgba(255,255,255,.06)}
    </style>
</head>
<body>
<main class="section">
    <div class="glass-card auth-wrap">
        <span class="section-label">WELCOME BACK</span>
        <h1>Login to your account.</h1>
        <p>Use your username or email address to continue.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
        {% endwith %}
        {% if error %}<div class="flash">{{ error }}</div>{% endif %}

        <form method="post" autocomplete="on">
            <input name="username" placeholder="Username or email" autocomplete="username" required>
            <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
            <button class="btn btn-primary" type="submit">Login <span>→</span></button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('home') }}">← Home</a>
            <a href="{{ url_for('register') }}">Create a new account</a>
        </div>
    </div>
</main>
</body>
</html>
