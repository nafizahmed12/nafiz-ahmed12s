<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="section"><div class="glass-card" style="max-width:520px;margin:60px auto;padding:32px"><h1>Login</h1>{% if error %}<p>{{ error }}</p>{% endif %}<form method="post"><input name="username" placeholder="Username" required><input type="password" name="password" placeholder="Password" required><button class="btn btn-primary" type="submit">Login</button></form><p>New here? <a href="{{ url_for('register') }}">Create account</a></p></div></main></body></html>
