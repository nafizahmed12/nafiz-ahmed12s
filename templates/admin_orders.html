<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Orders | Nafiz Commerce</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f5f7f8;color:#102a2f}.wrap{max-width:1250px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#159b63;font-weight:900}.h1{font-size:34px;font-weight:950;margin:5px 0}.muted{color:#6c7d81;font-size:13px}.btn{border:1px solid #dce6e6;border-radius:11px;padding:10px 14px;font-weight:850;cursor:pointer;background:#fff;color:#17363b;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:#159b63;color:#fff;border-color:#159b63}.btn:hover{transform:translateY(-1px)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid #dfe8e8;border-radius:16px;padding:17px;box-shadow:0 7px 24px rgba(16,42,47,.05)}.stat span{font-size:12px;color:#718286}.stat strong{display:block;font-size:25px;margin-top:5px}.toolbar{background:#fff;border:1px solid #dfe8e8;border-radius:16px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.search{flex:1;min-width:220px;border:1px solid #d5e1e1;border-radius:11px;padding:11px 13px;outline:none}.filter{border:1px solid #d5e1e1;border-radius:11px;padding:11px 12px;background:#fff;color:#17363b}.list{display:grid;gap:12px}.order{background:#fff;border:1px solid #dfe8e8;border-radius:17px;overflow:hidden;box-shadow:0 7px 25px rgba(16,42,47,.045)}.main{padding:17px}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.order-no{font-size:17px;font-weight:950}.customer{margin-top:4px;font-size:13px;color:#6c7d81}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;text-transform:capitalize}.paid{background:#e8f7ef;color:#087344}.pending,.initiated{background:#fff6d9;color:#8a6500}.failed,.cancelled{background:#ffe9e9;color:#a11}.processing,.confirmed{background:#e8f1ff;color:#245a9b}.completed,.fulfilled,.delivered{background:#e8f7ef;color:#087344}.shipped{background:#edf0ff;color:#4d51a8}.refunded{background:#f2eafa;color:#7145a5}.unfulfilled{background:#f1f4f4;color:#637477}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.mini{padding:11px 12px;border-radius:11px;background:#f8fafa;border:1px solid #edf1f1}.mini label{display:block;color:#75868a;font-size:11px}.mini strong{display:block;margin-top:3px;font-size:13px}.total strong{font-size:16px;color:#159b63}.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:13px;border-top:1px solid #edf1f1}.actions{display:flex;gap:8px;flex-wrap:wrap}.detail{display:none;background:#fbfdfd;border-top:1px solid #e5eded;padding:18px}.detail.open{display:block}.detail-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.detail-box{background:#fff;border:1px solid #e1e9e9;border-radius:13px;padding:14px}.detail-box h3{font-size:14px;margin:0 0 10px}.item,.payment{padding:10px 0;border-top:1px solid #edf1f1;font-size:13px}.item:first-child,.payment:first-child{border-top:0}.selects{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.selects select{border:1px solid #d5e1e1;border-radius:10px;padding:10px;background:#fff;flex:1;min-width:150px}.loading,.empty{text-align:center;padding:50px 20px;color:#718286}.danger{color:#a11}.notice{position:fixed;right:18px;bottom:18px;background:#17363b;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:0 12px 35px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.2s}.notice.show{opacity:1}.spinner{opacity:.6;pointer-events:none}@media(max-width:850px){.summary,.stats{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr}}@media(max-width:560px){.summary,.stats{grid-template-columns:1fr}.toolbar>*{width:100%}.search{min-width:0}.top{flex-direction:column}.top .navbtns{width:100%;display:flex;gap:8px}.top .navbtns .btn{flex:1}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">Nafiz Commerce / Control Center</div><div class="h1">Orders</div><div class="muted">Manage customer orders, payments and fulfillment from one place.</div></div><div class="navbtns"><a class="btn" href="/admin">← Dashboard</a><a class="btn primary" href="/">View Store</a></div></header><section class="summary"><div class="stat"><span>Total orders</span><strong id="total">—</strong></div><div class="stat"><span>Paid</span><strong id="paidCount">—</strong></div><div class="stat"><span>Pending payment</span><strong id="pendingCount">—</strong></div><div class="stat"><span>Revenue shown</span><strong id="revenue">—</strong></div></section><section class="toolbar"><input id="search" class="search" placeholder="Search order number, customer or email…" autocomplete="off"><select id="paymentFilter" class="filter"><option value="">All payments</option><option value="paid">Paid</option><option value="pending">Pending</option><option value="initiated">Initiated</option><option value="failed">Failed</option><option value="refunded">Refunded</option><option value="cancelled">Cancelled</option></select><select id="statusFilter" class="filter"><option value="">All order status</option><option value="pending">Pending</option><option value="processing">Processing</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option><option value="refunded">Refunded</option></select><select id="fulfillmentFilter" class="filter"><option value="">All fulfillment</option><option value="unfulfilled">Unfulfilled</option><option value="processing">Processing</option><option value="fulfilled">Fulfilled</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></section><section id="list" class="list"><div class="loading">Loading orders…</div></section></main><div id="notice" class="notice"></div><script>
let orders=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cls=s=>String(s||'').toLowerCase().replace(/[^a-z0-9_-]/g,'');const badgeClass=s=>s==='initiated'?'pending':s==='confirmed'?'processing':cls(s);function badge(s){return `<span class="badge ${badgeClass(s)}">${esc(s||'—')}</span>`}function money(o,v){return `${esc(o.currency||'BDT')} ${esc(v??'0.00')}`}
function filtered(){const q=document.getElementById('search').value.trim().toLowerCase(),p=document.getElementById('paymentFilter').value,s=document.getElementById('statusFilter').value,f=document.getElementById('fulfillmentFilter').value;return orders.filter(o=>(!q||`${o.order_number} ${o.username} ${o.email}`.toLowerCase().includes(q))&&(!p||o.payment_status===p)&&(!s||o.status===s)&&(!f||o.fulfillment_status===f))}
function updateSummary(){document.getElementById('total').textContent=orders.length;document.getElementById('paidCount').textContent=orders.filter(o=>o.payment_status==='paid').length;document.getElementById('pendingCount').textContent=orders.filter(o=>o.payment_status==='pending'||o.payment_status==='initiated').length;const rev=orders.filter(o=>o.payment_status==='paid').reduce((n,o)=>n+Number(o.total_amount||0),0);document.getElementById('revenue').textContent=`BDT ${rev.toFixed(2)}`}
function render(){const box=document.getElementById('list'),items=filtered();if(!items.length){box.innerHTML='<div class="empty">No matching orders found.</div>';return}box.innerHTML=items.map(o=>`<article class="order" id="o${o.id}"><div class="main"><div class="head"><div><div class="order-no">#${esc(o.order_number)}</div><div class="customer">${esc(o.username)} · ${esc(o.email)}</div></div><div class="badges">${badge(o.payment_status)}${badge(o.status)}${badge(o.fulfillment_status)}</div></div><div class="stats"><div class="mini"><label>Items</label><strong>${esc(o.item_count)}</strong></div><div class="mini"><label>Subtotal</label><strong>${money(o,o.subtotal)}</strong></div><div class="mini"><label>Shipping</label><strong>${money(o,o.shipping_amount)}</strong></div><div class="mini total"><label>Total</label><strong>${money(o,o.total_amount)}</strong></div></div><div class="foot"><span class="muted">${o.created_at?new Date(o.created_at).toLocaleString():'—'}</span><div class="actions"><button class="btn" type="button" onclick="toggleDetails(${o.id})">View details</button></div></div></div><div class="detail" id="d${o.id}"></div></article>`).join('')}
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt,headers:{Accept:'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}
async function load(){try{const d=await api('/api/admin/orders');orders=Array.isArray(d.items)?d.items:[];updateSummary();render()}catch(e){document.getElementById('list').innerHTML=`<div class="empty danger">${esc(e.message)}<br><br><button class="btn primary" onclick="load()">Try again</button></div>`}}
async function toggleDetails(id){const d=document.getElementById('d'+id);if(d.classList.contains('open')){d.classList.remove('open');return}try{d.innerHTML='<div class="loading">Loading order details…</div>';d.classList.add('open');const o=await api('/api/admin/orders/'+id);d.innerHTML=`<div class="detail-grid"><div class="detail-box"><h3>Order items</h3>${(o.items||[]).map(i=>`<div class="item"><strong>${esc(i.product_name)}</strong><br><span class="muted">${esc(i.quantity)} × ${money(o,i.unit_price)} = ${money(o,i.line_total)}</span></div>`).join('')||'<div class="muted">No items recorded.</div>'}</div><div class="detail-box"><h3>Payment history</h3>${(o.payments||[]).map(p=>`<div class="payment"><strong>${esc(p.provider||'Payment')}</strong> · ${badge(p.status)}<br><span class="muted">${esc(p.transaction_id||'No transaction ID')} · ${money(p,p.amount)}</span></div>`).join('')||'<div class="muted">No payment attempts recorded.</div>'}</div></div><div class="selects"><select id="s${id}"><option value="pending">Pending</option><option value="processing">Processing</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option><option value="refunded">Refunded</option></select><select id="p${id}"><option value="pending">Pending</option><option value="initiated">Initiated</option><option value="paid">Paid</option><option value="failed">Failed</option><option value="refunded">Refunded</option><option value="cancelled">Cancelled</option></select><select id="f${id}"><option value="unfulfilled">Unfulfilled</option><option value="processing">Processing</option><option value="fulfilled">Fulfilled</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select><button class="btn primary" onclick="save(${id},this)">Save changes</button></div>`;document.getElementById('s'+id).value=o.status;document.getElementById('p'+id).value=o.payment_status;document.getElementById('f'+id).value=o.fulfillment_status}catch(e){d.innerHTML=`<div class="danger">${esc(e.message)}</div>`}}
function notice(t){const n=document.getElementById('notice');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2200)}async function save(id,btn){const body={status:document.getElementById('s'+id).value,payment_status:document.getElementById('p'+id).value,fulfillment_status:document.getElementById('f'+id).value};btn.classList.add('spinner');try{await api('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=orders.find(x=>x.id===id);if(d)Object.assign(d,body);updateSummary();render();notice('Order updated successfully.')}catch(e){alert(e.message)}finally{btn.classList.remove('spinner')}}['search','paymentFilter','statusFilter','fulfillmentFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));load();
</script></body></html>
