<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Order Management | Nafiz Commerce</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f7f8;color:#102a2f}.wrap{max-width:1200px;margin:auto;padding:28px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#149b63;font-weight:900}.h1{font-size:32px;font-weight:900;margin:5px 0}.muted{color:#6c7d81;font-size:13px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e9f0f1;color:#17363b;text-decoration:none}.primary{background:#159b63;color:#fff}.grid{display:grid;gap:13px}.order{background:#fff;border:1px solid #dfe9e9;border-radius:16px;padding:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0;color:#6c7d81;font-size:12px}.meta strong{display:block;color:#17363b;margin-top:3px}.selects{display:flex;gap:8px;flex-wrap:wrap}.selects select{border:1px solid #d5e1e1;border-radius:9px;padding:9px;background:#fff}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f7ef;color:#087344;font-size:10px;font-weight:900}.detail{display:none;border-top:1px solid #e8eeee;margin-top:15px;padding-top:15px}.detail.open{display:block}.item,.payment{padding:8px 0;border-bottom:1px solid #eef2f2;font-size:13px}.loading{text-align:center;padding:40px}.danger{color:#a11}@media(max-width:750px){.meta{grid-template-columns:1fr 1fr}}@media(max-width:500px){.meta{grid-template-columns:1fr}.selects{width:100%}.selects select{width:100%}}</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">Nafiz Commerce</div><div class="h1">Order Management</div><div class="muted">View customer orders and update payment, order and fulfillment status.</div></div><div><a class="btn" href="/admin">← Admin Dashboard</a> <a class="btn primary" href="/">View Store</a></div></header><section id="list" class="grid"><div class="loading">Loading orders…</div></section></main><script>const csrf=(()=>{const m=document.querySelector('meta[name="csrf-token"]');return m?m.content:''})();const esc=s=>String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt,headers:{Accept:'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){const box=document.getElementById('list');try{const d=await api('/api/admin/orders');if(!d.items.length){box.innerHTML='<div class="loading">No orders yet.</div>';return}box.innerHTML=d.items.map(o=>`<article class="order" id="o${o.id}"><div class="row"><div><strong>${esc(o.order_number)}</strong><div class="muted">${esc(o.username)} · ${esc(o.email)}</div></div><span class="badge">${esc(o.payment_status)}</span></div><div class="meta"><div>Order status<strong>${esc(o.status)}</strong></div><div>Payment<strong>${esc(o.payment_status)}</strong></div><div>Fulfillment<strong>${esc(o.fulfillment_status)}</strong></div><div>Total<strong>${esc(o.currency)} ${esc(o.total_amount)}</strong></div></div><div class="row"><span class="muted">${o.item_count} item(s) · ${o.created_at?new Date(o.created_at).toLocaleString():''}</span><div><button class="btn" onclick="details(${o.id})">Details</button></div></div><div class="detail" id="d${o.id}"></div></article>`).join('')}catch(e){box.innerHTML='<div class="loading danger">'+esc(e.message)+'</div>'}}async function details(id){const d=document.getElementById('d'+id);if(d.classList.contains('open')){d.classList.remove('open');return}try{const o=await api('/api/admin/orders/'+id);d.innerHTML=`<div><strong>Items</strong>${o.items.map(i=>`<div class="item">${esc(i.product_name)} × ${i.quantity} — ${esc(o.currency)} ${esc(i.line_total)}</div>`).join('')||'<div class="muted">No items.</div>'}</div><div style="margin-top:14px"><strong>Payment attempts</strong>${o.payments.map(p=>`<div class="payment">${esc(p.provider)} · ${esc(p.status)} · ${esc(p.transaction_id||'No transaction ID')} · ${esc(p.currency)} ${esc(p.amount)}</div>`).join('')||'<div class="muted">No payment record.</div>'}</div><div class="selects" style="margin-top:15px"><select id="s${id}"><option value="">Order status</option><option>pending</option><option>processing</option><option>completed</option><option>cancelled</option><option>refunded</option></select><select id="p${id}"><option value="">Payment status</option><option>pending</option><option>paid</option><option>failed</option><option>refunded</option><option>cancelled</option></select><select id="f${id}"><option value="">Fulfillment status</option><option>unfulfilled</option><option>processing</option><option>fulfilled</option><option>shipped</option><option>delivered</option><option>cancelled</option></select><button class="btn primary" onclick="save(${id})">Save status</button></div>`;document.getElementById('s'+id).value=o.status;document.getElementById('p'+id).value=o.payment_status;document.getElementById('f'+id).value=o.fulfillment_status;d.classList.add('open')}catch(e){alert(e.message)}}async function save(id){const body={status:document.getElementById('s'+id).value,payment_status:document.getElementById('p'+id).value,fulfillment_status:document.getElementById('f'+id).value};Object.keys(body).forEach(k=>{if(!body[k])delete body[k]});try{await api('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});await load()}catch(e){alert(e.message)}}load();</script></body></html>
