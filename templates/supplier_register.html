<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a Supplier</title><style>body{font-family:system-ui;max-width:560px;margin:40px auto;padding:20px}input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}button{cursor:pointer}.error{color:#b91c1c}</style></head><body><h1>Become a Supplier</h1><p>Create your supplier account. Approval can be handled by admin before fulfillment.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><input name="company_name" placeholder="Company name" required><input name="username" placeholder="Username" minlength="3" required><input name="email" type="email" placeholder="Email" required><input name="phone" placeholder="Phone"><input name="country" value="Bangladesh" placeholder="Country"><input name="password" type="password" minlength="8" placeholder="Password (8+ characters)" required><button type="submit">Create Supplier Account</button></form><p>Already registered? <a href="{{ url_for('supplier_auth.supplier_login_page') }}">Supplier login</a></p></body></html>
