<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ phone.name }} - Nafiz Ecommerce</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0f12;
            color: #e2e8f0;
            padding: 30px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Breadcrumb */
        .breadcrumb {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 25px;
        }
        .breadcrumb a {
            color: #64748b;
            text-decoration: none;
        }
        .breadcrumb a:hover {
            color: #f97316;
        }

        /* Main Product Layout */
        .product-grid {
            display: grid;
            grid-template-columns: 480px 1fr;
            gap: 40px;
        }

        @media (max-width: 900px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Gallery Section */
        .main-image-container {
            width: 100%;
            height: 480px;
            background-color: #161b22;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #21262d;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .main-image-container img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        .thumbnail-list {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .thumb {
            width: 70px;
            height: 70px;
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .thumb.active, .thumb:hover {
            border-color: #f97316;
        }

        .thumb img {
            max-width: 70%;
            max-height: 70%;
            object-fit: contain;
        }

        /* Product Info Section */
        .brand-link {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 5px;
            display: block;
        }

        .product-title {
            font-size: 26px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
        }

        .price-type {
            font-size: 13px;
            color: #64748b;
        }

        .meta-info {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .meta-info span {
            color: #38bdf8;
        }

        /* Option Boxes */
        .section-box {
            background-color: #12161f;
            border: 1px solid #1e2430;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .option-title {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .option-btn {
            background-color: #1a202c;
            border: 1px solid #2d3748;
            color: #e2e8f0;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .option-btn.active {
            border-color: #f97316;
            background-color: rgba(249, 115, 22, 0.1);
            color: #ffffff;
        }

        .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Quantity Controls */
        .quantity-wrapper {
            margin-bottom: 25px;
        }

        .quantity-control {
            display: inline-flex;
            align-items: center;
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 8px;
        }

        .qty-btn {
            background: none;
            border: none;
            color: #ffffff;
            width: 38px;
            height: 38px;
            cursor: pointer;
            font-size: 16px;
        }

        .qty-btn:hover {
            background-color: #21262d;
        }

        .qty-val {
            width: 40px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn-shop-now {
            background-color: #ea580c;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-shop-now:hover {
            background-color: #c2410c;
        }

        .btn-add-cart {
            background-color: transparent;
            border: 1px solid #ea580c;
            color: #ffffff;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-add-cart:hover {
            background-color: rgba(234, 88, 12, 0.1);
        }

        .secondary-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-emi {
            background-color: #1e293b;
            color: #f97316;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
        }

        .btn-whatsapp {
            background-color: #065f46;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .delivery-info {
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="/">Home</a> &gt; <a href="/shop">Phones</a> &gt; {{ phone.name }}
        </div>

        <div class="product-grid">
            <!-- Left: Gallery -->
            <div>
                <div class="main-image-container">
                    <img src="https://store.storeimages.cdn-apple.com/4988/as-images.apple.com/is/iphone-15-pro-naturaltitanium-select?wid=512&hei=512&fmt=png-alpha" alt="{{ phone.name }}" id="mainImg">
                </div>
                <div class="thumbnail-list">
                    <div class="thumb active"><img src="https://store.storeimages.cdn-apple.com/4988/as-images.apple.com/is/iphone-15-pro-naturaltitanium-select?wid=512&hei=512&fmt=png-alpha"></div>
                    <div class="thumb"><img src="https://store.storeimages.cdn-apple.com/4988/as-images.apple.com/is/iphone-15-pro-bluetitanium-select?wid=512&hei=512&fmt=png-alpha"></div>
                    <div class="thumb"><img src="https://store.storeimages.cdn-apple.com/4988/as-images.apple.com/is/iphone-15-pro-whitetitanium-select?wid=512&hei=512&fmt=png-alpha"></div>
                    <div class="thumb"><img src="https://store.storeimages.cdn-apple.com/4988/as-images.apple.com/is/iphone-15-pro-blacktitanium-select?wid=512&hei=512&fmt=png-alpha"></div>
                </div>
            </div>

            <!-- Right: Details -->
            <div>
                <a href="#" class="brand-link">Apple</a>
                <h1 class="product-title">{{ phone.name }}</h1>

                <div class="price-row">
                    <span class="price">৳{{ phone.price.replace(' BDT', '') }}</span>
                    <span class="price-type">(Cash Price)</span>
                </div>

                <div class="meta-info">
                    <div>Availability: <span>Online Order</span></div>
                    <div>Code: <span>AGL32471</span></div>
                </div>

                <!-- Color Selection -->
                <div class="section-box">
                    <div class="option-title">Color:</div>
                    <div class="options-grid">
                        <div class="option-btn"><span class="color-dot" style="background:#000;"></span> Black</div>
                        <div class="option-btn"><span class="color-dot" style="background:#3b82f6;"></span> Blue</div>
                        <div class="option-btn active"><span class="color-dot" style="background:#ea580c;"></span> Natural</div>
                        <div class="option-btn"><span class="color-dot" style="background:#e2e8f0;"></span> White</div>
                    </div>
                </div>

                <!-- Model Selection -->
                <div class="section-box">
                    <div class="option-title">Storage:</div>
                    <div class="options-grid">
                        <div class="option-btn">128GB</div>
                        <div class="option-btn active">256GB</div>
                        <div class="option-btn">512GB</div>
                    </div>
                </div>

                <!-- Quantity -->
                <div class="quantity-wrapper">
                    <div class="option-title">Select Quantity:</div>
                    <div class="quantity-control">
                        <button class="qty-btn" onclick="decreaseQty()">-</button>
                        <span class="qty-val" id="qty">1</span>
                        <button class="qty-btn" onclick="increaseQty()">+</button>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="btn-shop-now">Shop Now</button>
                    <button class="btn-add-cart"><i class="fa-solid fa-cart-shopping"></i> Add To Cart</button>
                </div>

                <div class="secondary-actions">
                    <button class="btn-emi">% EMI Available View Plans</button>
                    <button class="btn-whatsapp"><i class="fa-brands fa-whatsapp"></i> Whatsapp</button>
                </div>

                <div class="delivery-info">
                    <i class="fa-solid fa-truck-fast"></i> Delivery Timescale: 3-5 Days
                </div>
            </div>
        </div>
    </div>

    <script>
        let count = 1;
        function increaseQty() {
            count++;
            document.getElementById('qty').innerText = count;
        }
        function decreaseQty() {
            if (count > 1) {
                count--;
                document.getElementById('qty').innerText = count;
            }
        }
    </script>
</body>
</html>
