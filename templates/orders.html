<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders — Nafiz Store</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><style>.orders{max-width:1000px;margin:0 auto;padding:40px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:25px}.order{border:1px solid #283452;border-radius:18px;padding:20px;margin:14px 0;background:rgba(15,22,42,.82)}.line{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:7px 0}.badge{padding:6px 10px;border-radius:999px;background:#18233e;font-size:12px;font-weight:800}.paid{background:#123d2b;color:#8ff0bd}.unpaid{background:#49331b;color:#ffd18a}.failed{background:#4b2027;color:#ffadb7}.items{border-top:1px solid #273252;margin-top:12px;padding-top:12px}.empty{padding:50px;text-align:center;opacity:.7}</style></head><body><main class="orders"><div class="top"><div><span class="section-label">COMMERCE</span><h1>My Orders</h1><p>Track your purchases and payment status.</p></div><div><a class="btn btn-secondary" href="{{ url_for('account') }}">Account</a> <a class="btn btn-primary" href="/shop">Shop</a></div></div><div id="list"><div class="empty">Loading orders…</div></div></main>
<script>
async function load(){const box=document.getElementById('list');try{const r=await fetch('/api/orders',{credentials:'same-origin'});const d=await r.json();if(r.status===401){location.href='/user-login';return}if(!r.ok)throw new Error(d.error||'Could not load orders.');if(!d.items.length){box.innerHTML='<div class="empty">You have no orders yet.</div>';return}box.innerHTML=d.items.map(o=>{const cls=o.payment_status==='paid'?'paid':(o.payment_status==='failed'?'failed':'unpaid');return `<article class="order"><div class="line"><strong>${esc(o.order_number)}</strong><span class="badge ${cls}">${esc(o.payment_status)}</span></div><div class="line"><span>Order status</span><strong>${esc(o.status)}</strong></div><div class="line"><span>Fulfillment</span><strong>${esc(o.fulfillment_status)}</strong></div><div class="line"><span>Total</span><strong>${esc(o.currency)} ${esc(o.total_amount)}</strong></div><div class="line"><span>Date</span><span>${o.created_at?new Date(o.created_at).toLocaleString():''}</span></div><div class="items"><button class="btn btn-secondary" onclick="details(${o.id})">View details</button>${o.payment_status!=='paid'&&o.status!=='cancelled'?` <button class="btn btn-primary" onclick="pay(${o.id})">Pay Now</button>`:''}</div></article>`}).join('')}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function details(id){try{const r=await fetch('/api/orders/'+id,{credentials:'same-origin'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load order.');alert(d.items.map(i=>`${i.product_name} × ${i.quantity} — ${i.line_total}`).join('\n')+'\n\nPayment: '+d.payment_status+'\nTotal: '+d.currency+' '+d.total_amount)}catch(e){alert(e.message)}}
async function pay(id){try{const r=await fetch('/api/orders/'+id+'/payments/sslcommerz/initiate',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Payment could not be started.');location.href=d.gateway_page_url}catch(e){alert(e.message)}}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}load();
</script></body></html>
