<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Orders — Nafiz Store</title>
<link rel="stylesheet" href="{{ url_for('static', filename='portfolio.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='portfolio-theme.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
:root{--panel:rgba(13,20,38,.82);--line:rgba(148,163,184,.16);--muted:#94a3b8;--text:#f8fafc;--accent:#7dd3fc}.orders{max-width:1120px;margin:auto;padding:30px 20px 80px}.nav{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 0 34px;border-bottom:1px solid var(--line)}.brand{font-size:22px;font-weight:850;letter-spacing:-.5px}.brand span{color:var(--accent)}.navlinks{display:flex;gap:9px;flex-wrap:wrap}.hero{padding:54px 0 30px;display:flex;justify-content:space-between;align-items:end;gap:30px}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--accent)}h1{font-size:clamp(34px,6vw,58px);letter-spacing:-.045em;line-height:1;margin:10px 0 13px}.hero p{color:var(--muted);max-width:650px;margin:0;line-height:1.7}.count{min-width:130px;text-align:center;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(16px)}.count strong{display:block;font-size:28px}.count small{color:var(--muted)}#list{display:grid;gap:18px}.order{border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:24px;box-shadow:0 18px 55px rgba(0,0,0,.16);backdrop-filter:blur(18px);transition:transform .2s,border-color .2s}.order:hover{transform:translateY(-2px);border-color:rgba(125,211,252,.3)}.order-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}.order-id{font-weight:850;font-size:17px}.date{font-size:13px;color:var(--muted);margin-top:5px}.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800;text-transform:capitalize}.badge:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}.paid{color:#86efac;background:rgba(34,197,94,.1)}.unpaid{color:#fcd34d;background:rgba(234,179,8,.1)}.failed{color:#fda4af;background:rgba(244,63,94,.1)}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px 0}.detail{padding:13px 15px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid rgba(148,163,184,.09)}.detail label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.detail strong{font-size:14px}.total strong{font-size:20px}.items{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line)}.actions{display:flex;gap:9px;flex-wrap:wrap}.empty{text-align:center;padding:65px 25px;border:1px dashed var(--line);border-radius:22px;background:rgba(13,20,38,.5)}.empty h3{font-size:22px;margin:0 0 8px}.empty p{color:var(--muted);margin:0 0 20px}.error{color:#fda4af}.loading{color:var(--muted);text-align:center;padding:50px}.btn{border-radius:12px!important}.back{color:var(--muted);text-decoration:none;font-size:14px}.back:hover{color:var(--text)}@media(max-width:700px){.hero{display:block;padding-top:38px}.count{margin-top:22px;width:100%;box-sizing:border-box}.details{grid-template-columns:1fr}.nav{align-items:flex-start;flex-direction:column}.navlinks{width:100%}.navlinks .btn{flex:1;text-align:center}}
</style>
</head>
<body>
<main class="orders">
<header class="nav"><a class="back" href="{{ url_for('home') }}"><span class="brand">Nafiz<span>.</span></span></a><div class="navlinks"><a class="btn btn-secondary" href="{{ url_for('dashboard') }}">Dashboard</a><a class="btn btn-secondary" href="{{ url_for('account') }}">Account</a><a class="btn btn-primary" href="/shop">Shop →</a></div></header>
<section class="hero"><div><span class="eyebrow">ACCOUNT / ORDERS</span><h1>My Orders</h1><p>Your complete purchase history, payment status and fulfillment details — all in one place.</p></div><div class="count"><strong id="count">—</strong><small>Total orders</small></div></section>
<section id="list"><div class="loading">Loading your orders…</div></section>
</main>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function paymentClass(s){return s==='paid'?'paid':s==='failed'?'failed':'unpaid'}
async function api(url){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(_){d={error:'Invalid server response.'}}if(r.status===401){location.href='{{ url_for("user_login") }}';return null}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
async function loadOrders(){const box=document.getElementById('list');try{const d=await api('/api/orders?per_page=50');if(!d)return;const orders=Array.isArray(d.items)?d.items:[];document.getElementById('count').textContent=Number(d.total??orders.length);if(!orders.length){box.innerHTML='<div class="empty"><h3>No orders yet</h3><p>Your completed purchases will appear here.</p><a class="btn btn-primary" href="/shop">Explore the shop →</a></div>';return}box.innerHTML=orders.map(o=>{const pc=paymentClass(o.payment_status);const date=o.created_at?new Date(o.created_at).toLocaleString(): '—';return `<article class="order"><div class="order-head"><div><div class="order-id">Order #${esc(o.order_number)}</div><div class="date">${esc(date)}</div></div><span class="badge ${pc}">${esc(o.payment_status)}</span></div><div class="details"><div class="detail"><label>Order status</label><strong>${esc(o.status)}</strong></div><div class="detail"><label>Fulfillment</label><strong>${esc(o.fulfillment_status)}</strong></div><div class="detail total"><label>Total</label><strong>${esc(o.currency)} ${esc(o.total_amount)}</strong></div></div><div class="items"><span style="color:var(--muted);font-size:13px">Order #${esc(o.id)} · Secure checkout</span><div class="actions"><button class="btn btn-secondary" type="button" onclick="details(${Number(o.id)})">View details</button>${o.payment_status!=='paid'&&o.status!=='cancelled'?`<button class="btn btn-primary" type="button" onclick="pay(${Number(o.id)})">Pay Now →</button>`:''}</div></div></article>`}).join('')}catch(e){box.innerHTML=`<div class="empty error"><h3>Couldn’t load your orders</h3><p>${esc(e.message)}</p><button class="btn btn-primary" onclick="loadOrders()">Try again</button></div>`}}
async function details(id){try{const o=await api('/api/orders/'+id);if(!o)return;const items=(o.items||[]).map(i=>`${i.product_name} × ${i.quantity} — ${o.currency} ${i.line_total}`).join('\n')||'No items.';alert(`Order #${o.order_number}\n\nStatus: ${o.status}\nPayment: ${o.payment_status}\nFulfillment: ${o.fulfillment_status}\nTotal: ${o.currency} ${o.total_amount}\n\nItems:\n${items}`)}catch(e){alert(e.message)}}
async function pay(id){try{const r=await fetch('/api/orders/'+id+'/payments/sslcommerz/initiate',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'}});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='{{ url_for("user_login") }}';return}if(!r.ok)throw new Error(d.error||'Payment could not be started.');if(!d.gateway_page_url)throw new Error('Payment gateway URL was not returned.');location.href=d.gateway_page_url}catch(e){alert(e.message)}}
loadOrders();
</script>
</body>
</html>
