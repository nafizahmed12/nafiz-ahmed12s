<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Orders — Nafiz Store</title>
<link rel="stylesheet" href="{{ url_for('static', filename='portfolio.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='portfolio-theme.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
.orders{max-width:1000px;margin:0 auto;padding:40px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:25px}.order{border:1px solid #283452;border-radius:18px;padding:20px;margin:14px 0;background:rgba(15,22,42,.82)}.line{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:7px 0}.badge{padding:6px 10px;border-radius:999px;background:#18233e;font-size:12px;font-weight:800}.paid{background:#123d2b;color:#8ff0bd}.unpaid{background:#49331b;color:#ffd18a}.failed{background:#4b2027;color:#ffadb7}.items{border-top:1px solid #273252;margin-top:12px;padding-top:12px}.item{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}.empty{padding:50px;text-align:center;opacity:.7}.error{color:#ffadb7}.actions{display:flex;gap:10px;flex-wrap:wrap}.summary{margin:0 0 18px;opacity:.75}
</style>
</head>
<body>
<main class="orders">
<div class="top">
  <div><span class="section-label">COMMERCE</span><h1>My Orders</h1><p>Track your purchases, order status and payment status.</p></div>
  <div class="actions"><a class="btn btn-secondary" href="{{ url_for('dashboard') }}">Dashboard</a><a class="btn btn-secondary" href="{{ url_for('account') }}">Account</a><a class="btn btn-primary" href="/shop">Shop</a></div>
</div>
<div id="summary" class="summary">Loading your orders…</div>
<div id="list"><div class="empty">Loading orders…</div></div>
</main>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function paymentClass(s){return s==='paid'?'paid':(s==='failed'?'failed':'unpaid')}
async function api(url){
  const r=await fetch(url,{method:'GET',credentials:'same-origin',cache:'no-store',headers:{'Accept':'application/json'}});
  const text=await r.text();
  let data={};
  try{data=text?JSON.parse(text):{}}catch(_){data={error:'Server returned an invalid response.'}}
  if(r.status===401){window.location.href='{{ url_for("user_login") }}';return null}
  if(!r.ok)throw new Error(data.error||`Could not load orders (${r.status}).`);
  return data;
}
async function loadOrders(){
  const box=document.getElementById('list'), summary=document.getElementById('summary');
  box.innerHTML='<div class="empty">Loading orders…</div>';
  try{
    const data=await api('/api/orders?per_page=50');
    if(!data)return;
    const items=Array.isArray(data.items)?data.items:[];
    summary.textContent=`${Number(data.total||items.length)} order${Number(data.total||items.length)===1?'':'s'} found`;
    if(!items.length){box.innerHTML='<div class="empty"><h3>No orders yet.</h3><p>Once you complete a purchase, it will appear here.</p><a class="btn btn-primary" href="/shop">Start shopping →</a></div>';return;}
    box.innerHTML=items.map(o=>{
      const cls=paymentClass(o.payment_status);
      return `<article class="order">
        <div class="line"><strong>${esc(o.order_number)}</strong><span class="badge ${cls}">${esc(o.payment_status)}</span></div>
        <div class="line"><span>Order status</span><strong>${esc(o.status)}</strong></div>
        <div class="line"><span>Fulfillment</span><strong>${esc(o.fulfillment_status)}</strong></div>
        <div class="line"><span>Total</span><strong>${esc(o.currency)} ${esc(o.total_amount)}</strong></div>
        <div class="line"><span>Date</span><span>${o.created_at?new Date(o.created_at).toLocaleString():'—'}</span></div>
        <div class="items"><button class="btn btn-secondary" type="button" onclick="details(${Number(o.id)})">View details</button>${o.payment_status!=='paid'&&o.status!=='cancelled'?` <button class="btn btn-primary" type="button" onclick="pay(${Number(o.id)})">Pay Now</button>`:''}</div>
      </article>`;
    }).join('');
  }catch(e){summary.textContent='';box.innerHTML=`<div class="empty error"><h3>Could not load your orders</h3><p>${esc(e.message)}</p><button class="btn btn-primary" type="button" onclick="loadOrders()">Try again</button></div>`;}
}
async function details(id){
  try{
    const o=await api('/api/orders/'+id);if(!o)return;
    const items=(o.items||[]).map(i=>`${i.product_name} × ${i.quantity} — ${o.currency} ${i.line_total}`).join('\n')||'No items.';
    alert(`Order: ${o.order_number}\nStatus: ${o.status}\nPayment: ${o.payment_status}\nFulfillment: ${o.fulfillment_status}\nTotal: ${o.currency} ${o.total_amount}\n\nItems:\n${items}`);
  }catch(e){alert(e.message)}
}
async function pay(id){
  try{
    const r=await fetch('/api/orders/'+id+'/payments/sslcommerz/initiate',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept':'application/json'}});
    const d=await r.json().catch(()=>({}));
    if(r.status===401){window.location.href='{{ url_for("user_login") }}';return}
    if(!r.ok)throw new Error(d.error||'Payment could not be started.');
    if(!d.gateway_page_url)throw new Error('Payment gateway URL was not returned.');
    window.location.href=d.gateway_page_url;
  }catch(e){alert(e.message)}
}
loadOrders();
</script>
</body>
</html>
