<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Password Recovery</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='portfolio.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='portfolio-theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>.auth-wrap{max-width:520px;margin:70px auto;padding:34px}.auth-wrap form{display:grid;gap:14px}.auth-wrap input{width:100%;box-sizing:border-box}.flash{padding:12px 14px;border-radius:12px;margin-bottom:16px}</style>
</head>
<body>
<main class="section">
  <div class="glass-card auth-wrap">
    <span class="section-label">ADMIN RECOVERY</span>
    <h1>Forgot Admin Password?</h1>
    {% if sent %}
      <div class="flash">If the recovery email matches the configured admin account, a reset link has been sent. Check your email.</div>
    {% else %}
      <p>Enter your configured admin recovery email. The reset link expires in 30 minutes.</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input name="identifier" type="email" placeholder="Admin recovery email" autocomplete="email" required>
        <button class="btn btn-primary" type="submit">Send reset link →</button>
      </form>
    {% endif %}
    <p style="margin-top:18px"><a href="{{ url_for('login') }}">← Back to Admin Login</a></p>
  </div>
</main>
</body>
</html>
