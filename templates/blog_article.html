<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="{{article.seo_description or article.excerpt}}"><link rel="canonical" href="{{request.url}}"><title>{{article.title}} | Nafiz Store</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111827;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto;padding:25px 18px 70px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:45px}.brand{font-weight:900;font-size:19px;text-decoration:none;color:#111827}.back{font-size:13px;color:#16a34a;font-weight:800;text-decoration:none}.cat{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#16a34a;font-weight:900}.title{font-size:clamp(32px,6vw,52px);line-height:1.12;letter-spacing:-.035em;margin:8px 0 12px}.meta{font-size:12px;color:#6b7280;margin-bottom:28px}.hero{width:100%;max-height:460px;object-fit:cover;border-radius:16px;background:#eef2f7;margin-bottom:30px}.content{font-size:17px;line-height:1.85;color:#263244;white-space:pre-wrap;overflow-wrap:anywhere}.content::first-letter{}.footer{border-top:1px solid #e5e7eb;margin-top:45px;padding-top:20px;color:#6b7280;font-size:12px}@media(max-width:600px){.wrap{padding:18px 15px 50px}.nav{margin-bottom:30px}.content{font-size:16px}.hero{border-radius:12px}}</style></head>
<body><main class="wrap"><nav class="nav"><a class="brand" href="{{url_for('home')}}">Nafiz Store</a><a class="back" href="{{url_for('blog.blog_index')}}">← All articles</a></nav><article><div class="cat">{{article.category}}</div><h1 class="title">{{article.title}}</h1><div class="meta">Published {{article.published_at.strftime('%d %B %Y')}}</div>{% if article.featured_image_url %}<img class="hero" src="{{article.featured_image_url}}" alt="{{article.title}}">{% endif %}<div class="content">{{article.content}}</div></article><footer class="footer">Written and published by Nafiz Store. Content is intended to provide useful information and analysis.</footer></main></body></html>
