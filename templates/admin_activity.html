<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Activity Log | NafizTech</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font:14px Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.panel{background:white;border:1px solid #e2e7ef;border-radius:12px;padding:16px;margin-top:15px}.row{padding:12px 0;border-bottom:1px solid #edf0f4;display:grid;grid-template-columns:150px 130px 1fr;gap:12px}.muted{color:#6b7280;font-size:12px}select{padding:9px;border:1px solid #d5dce7;border-radius:8px}@media(max-width:650px){.row{grid-template-columns:1fr;gap:3px}}</style></head><body>{% include 'admin_unified_nav.html' %}<main class="wrap"><h1>Admin Activity Log</h1><p class="muted">Recent editorial and settings actions (latest 250).</p><form><select name="action" onchange="this.form.submit()"><option value="">All actions</option>{% for action in ['article_create','article_update','article_publish','article_schedule','article_delete','article_revision_restore','media_upload','media_delete','site_settings_update','scheduled_publish'] %}<option value="{{action}}" {% if selected_action==action %}selected{% endif %}>{{action}}</option>{% endfor %}</select></form><section class="panel">{% for entry in entries %}<div class="row"><span class="muted">{{entry.created_at}}</span><b>{{entry.actor}} · {{entry.action}}</b><span>{{entry.summary}}</span></div>{% else %}<p class="muted">No activity recorded yet.</p>{% endfor %}</section></main></body></html>
