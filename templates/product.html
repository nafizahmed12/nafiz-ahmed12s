<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Product details at Nafiz -Ecommerce."><title>Nafiz -Ecommerce — Product</title><style>:root{--p:#16a34a;--p2:#15803d;--soft:#ecfdf3;--bg:#f6f8fb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--navy:#0b1f3a;--star:#e0a600}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}.wrap{width:min(1280px,94%);margin:auto}.top{background:var(--navy);color:#fff;text-align:center;padding:9px;font-size:10px;font-weight:800}.nav{height:72px;display:flex;align-items:center;gap:30px;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.logo{font-size:24px;font-weight:900;color:var(--navy)}.logo span{color:var(--p)}.links{display:flex;gap:22px;font-size:12px;font-weight:700;color:#475569}.links a:hover{color:var(--p)}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:12px 16px;font-size:11px;font-weight:800;cursor:pointer}.primary{background:var(--p);color:#fff}.primary:hover{background:var(--p2)}.primary:disabled{opacity:.6;cursor:default}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.crumb{padding:22px 0 0;font-size:11px;color:var(--muted)}.crumb a:hover{color:var(--p)}.detail{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:24px 0 40px;align-items:start}.pic{background:#fff;border:1px solid var(--line);border-radius:18px;height:460px;display:grid;place-items:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:contain;padding:20px}.fallback{font-weight:900;color:var(--p);font-size:34px}.info small{color:var(--p);font-size:9px;text-transform:uppercase;font-weight:900;letter-spacing:1px}.info h1{font-size:clamp(26px,3vw,36px);line-height:1.2;margin:10px 0;color:var(--navy)}.stars{color:var(--star);font-weight:900;letter-spacing:2px;font-size:15px}.ratesum{display:flex;align-items:center;gap:10px;margin:6px 0 14px;font-size:11px;color:var(--muted)}.price{font-size:30px;font-weight:900;margin:10px 0;color:var(--navy)}.desc{color:var(--muted);font-size:13px;line-height:1.8;margin:14px 0}.stockline{font-size:11px;font-weight:800;margin-bottom:16px}.stock-in{color:#067d62}.stock-low{color:#c2410c}.stock-out{color:#dc2626}.wide{width:100%;padding:14px 16px;font-size:12px}.section{margin:40px 0}.section h2{font-size:20px;color:var(--navy);margin-bottom:16px}.review{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#fff;margin-bottom:12px}.review-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.review-title{font-weight:800;margin:6px 0 3px;color:var(--navy)}.review-body{color:#3d5559;font-size:12px;line-height:1.7;white-space:pre-wrap}.muted{color:var(--muted);font-size:11px}.empty{text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);background:#fff}.form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.form label{display:block;font-size:11px;font-weight:800;color:var(--navy);margin:12px 0 6px}.form label:first-child{margin-top:0}.starpick{display:flex;gap:4px;font-size:26px}.starpick span{cursor:pointer;color:#d6dde3}.starpick span.active{color:var(--star)}.form input,.form textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}.form input:focus,.form textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #16a34a18}.form textarea{min-height:90px;resize:vertical}.notice{position:fixed;right:18px;bottom:18px;z-index:50;background:var(--navy);color:#fff;padding:13px 16px;border-radius:12px;display:none;font-size:11px}.notice.show{display:block}@media(max-width:800px){.links{display:none}.detail{grid-template-columns:1fr;gap:20px}.pic{height:320px}}</style></head><body><div class="top">FREE DELIVERY ON SELECTED ORDERS • SECURE CHECKOUT • NEW DEALS EVERY WEEK</div><header class="nav"><div class="wrap" style="display:flex;align-items:center;gap:30px;width:min(1280px,94%)"><a class="logo" href="/">Nafiz -Ecommerce</a><nav class="links"><a href="/">Home</a><a href="/shop">Shop</a><a href="/shop">Categories</a><a href="/affiliate-picks">Affiliate Picks</a></nav><div class="actions"><a class="btn secondary" href="/user-login">Account</a><a class="btn primary" href="/shop">Cart</a></div></div></header><main class="wrap"><div class="crumb"><a href="/shop">Shop</a> / <span id="crumbName">Product</span></div><section id="detail" class="detail"><div class="pic"><span class="fallback">Loading…</span></div><div class="info"><div class="empty">Loading product…</div></div></section><section class="section"><h2>Customer reviews</h2><div id="reviewSummary" class="muted">Loading reviews…</div><div id="reviews"></div></section><section class="section"><h2>Write a review</h2><div id="reviewFormArea" class="form"><p class="muted">Checking your account…</p></div></section></main><div id="notice" class="notice"></div><script>const $=x=>document.getElementById(x);const productId={{ product_id }};let myRating=0;function note(x){$('notice').textContent=x;$('notice').classList.add('show');setTimeout(()=>$('notice').classList.remove('show'),4000)}function esc(s){return String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({error:'Invalid server response.'}));if(!r.ok)throw Object.assign(new Error(d.error||'Request failed'),{status:r.status});return d}function stars(n){const full=Math.round(n);return '★★★★★☆☆☆☆☆'.slice(5-full,10-full)}function stockLine(p){if(p.product_type==='digital')return '';const q=p.stock_quantity;if(!Number.isFinite(q))return '';if(q<=0)return '<div class="stockline stock-out">Out of stock</div>';if(q<=5)return `<div class="stockline stock-low">Only ${q} left</div>`;return '<div class="stockline stock-in">In stock</div>'}async function loadProduct(){try{const p=await api('/api/products/'+productId);$('crumbName').textContent=p.name;document.title='Nafiz -Ecommerce — '+p.name;const img=p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:'';$('detail').children[0].innerHTML=`${img}<span class="fallback" style="${p.image_url?'display:none':''}">PRODUCT</span>`;$('detail').children[1].innerHTML=`<small>${esc(p.product_type||'Product')}</small><h1>${esc(p.name)}</h1><div id="ratingLine"></div><div class="price">৳${esc(p.price)}</div>${stockLine(p)}<div class="desc">${esc(p.description||'Quality product from Nafiz -Ecommerce.')}</div><button class="btn primary wide" onclick="add(${p.id})">Add to Cart</button>`}catch(e){$('detail').children[1].innerHTML=`<div class="empty">${e.status===404?'This product could not be found.':esc(e.message)}</div>`}}async function loadReviews(){try{const d=await api('/api/products/'+productId+'/reviews');const line=$('ratingLine');if(line)line.innerHTML=d.review_count?`<div class="ratesum"><span class="stars">${stars(d.average_rating)}</span><span>${d.average_rating.toFixed(1)} · ${d.review_count} review${d.review_count===1?'':'s'}</span></div>`:'<div class="ratesum muted">No reviews yet</div>';$('reviewSummary').textContent=d.review_count?`${d.average_rating.toFixed(1)} average from ${d.review_count} review${d.review_count===1?'':'s'}`:'Be the first to review this product.';$('reviews').innerHTML=d.items.length?d.items.map(r=>`<article class="review"><div class="review-head"><span class="stars">${stars(r.rating)}</span><span class="muted">${esc(r.author)} · ${esc((r.created_at||'').slice(0,10))}</span></div>${r.title?`<div class="review-title">${esc(r.title)}</div>`:''}<div class="review-body">${esc(r.body)}</div></article>`).join(''):''}catch(e){$('reviewSummary').textContent='Could not load reviews.'}}async function add(id){try{const d=await api('/api/cart/items',{method:'POST',body:JSON.stringify({product_id:id,quantity:1})});note('Added to cart ✓')}catch(e){note(e.message);if(e.status===401)location.href='/user-login'}}function pickStar(n){myRating=n;document.querySelectorAll('.starpick span').forEach((el,i)=>el.classList.toggle('active',i<n))}function renderReviewForm(loggedIn){const area=$('reviewFormArea');if(!loggedIn){area.innerHTML=`<p class="muted">Please <a href="/user-login" style="color:var(--p);font-weight:800">log in</a> to write a review.</p>`;return}area.innerHTML=`<label>Your rating</label><div class="starpick" id="starpick"></div><label for="rvTitle">Title (optional)</label><input id="rvTitle" maxlength="180" placeholder="Sum it up in a few words"><label for="rvBody">Your review</label><textarea id="rvBody" maxlength="5000" placeholder="What did you like or dislike?"></textarea><button class="btn primary wide" style="margin-top:16px" onclick="submitReview()">Submit review</button>`;const pick=$('starpick');pick.innerHTML=[1,2,3,4,5].map(n=>`<span onclick="pickStar(${n})">★</span>`).join('')}async function submitReview(){if(myRating<1){note('Please choose a star rating.');return}const body=$('rvBody').value.trim();if(!body){note('Please write a few words for your review.');return}const btn=document.querySelector('#reviewFormArea .btn.primary');btn.disabled=true;btn.textContent='Submitting…';try{const d=await api('/api/products/'+productId+'/reviews',{method:'POST',body:JSON.stringify({rating:myRating,title:$('rvTitle').value.trim(),body})});note(d.message||'Thanks for your review!');$('rvTitle').value='';$('rvBody').value='';pickStar(0)}catch(e){note(e.message)}finally{btn.disabled=false;btn.textContent='Submit review'}}async function checkAuth(){try{await api('/api/cart');renderReviewForm(true)}catch(e){renderReviewForm(e.status!==401)}}loadProduct();loadReviews();checkAuth();</script></body></html>
