<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reset Password — Nafiz Ahmed</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='portfolio.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='portfolio-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>.auth-wrap{max-width:540px;margin:70px auto;padding:34px}.auth-wrap form{display:grid;gap:14px}.auth-wrap input{width:100%;box-sizing:border-box}.auth-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}.flash{padding:12px 14px;border-radius:12px;margin-bottom:16px;background:rgba(255,255,255,.06)}</style>
</head>
<body>
<main class="section">
  <div class="glass-card auth-wrap">
    <span class="section-label">ACCOUNT RECOVERY</span>
    <h1>Set a new password.</h1>
    {% if error %}<div class="flash">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="token" value="{{ token }}">
      <input type="password" name="password" placeholder="New password (8+ characters)" autocomplete="new-password" minlength="8" required>
      <input type="password" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>
      <button class="btn btn-primary" type="submit">Reset password <span>→</span></button>
    </form>
    <div class="auth-links"><a href="{{ url_for('user_login') }}">← Back to login</a></div>
  </div>
</main>
</body>
</html>
