<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Catalog Admin</title><style>body{font-family:system-ui,sans-serif;max-width:1200px;margin:auto;padding:24px}form{display:grid;gap:10px;max-width:850px}input,textarea,select{padding:10px;border:1px solid #ccd3df;border-radius:8px}textarea{min-height:130px}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}.card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><nav><a href="/admin">Admin</a> · <a href="/phones">Public catalog</a></nav><h1>{{ 'Edit phone' if editing else 'Add phone' }}</h1><form method="post" action="{{ url_for('phone_catalog.update_phone',phone_id=editing.id) if editing else url_for('phone_catalog.create_phone') }}"><input name="brand" required maxlength="80" placeholder="Brand" value="{{ editing.brand if editing else '' }}"><input name="model" required maxlength="180" placeholder="Model" value="{{ editing.model if editing else '' }}"><input name="slug" placeholder="SEO slug (optional)" value="{{ editing.slug if editing else '' }}"><input name="short_description" required maxlength="320" placeholder="Short description" value="{{ editing.short_description if editing else '' }}"><textarea name="content" required placeholder="Original useful editorial content (80+ characters)">{{ editing.content if editing else '' }}</textarea><input name="image_url" placeholder="Image URL" value="{{ editing.image_url if editing else '' }}"><input name="release_date" placeholder="Release date" value="{{ editing.release_date if editing else '' }}"><input name="price_usd" placeholder="Price USD" value="{{ editing.price_usd if editing else '' }}"><input name="price_bdt" placeholder="Price BDT" value="{{ editing.price_bdt if editing else '' }}"><textarea name="specs_json" placeholder='{"display":"6.7-inch","ram":"12GB","battery":"5000mAh"}'>{{ editing.specs_json if editing else '{}' }}</textarea><input name="seo_description" maxlength="320" placeholder="SEO description" value="{{ editing.seo_description if editing else '' }}"><select name="status"><option value="draft" {% if not editing or editing.status=='draft' %}selected{% endif %}>Draft</option><option value="published" {% if editing and editing.status=='published' %}selected{% endif %}>Published</option></select><button type="submit">Save</button></form><hr><h2>Catalog</h2>{% for p in phones %}<div class="card"><strong>{{ p.brand }} {{ p.model }}</strong> — {{ p.status }}<div class="actions"><a href="{{ url_for('phone_catalog.edit_phone',phone_id=p.id) }}">Edit</a>{% if p.status=='published' %}<a href="{{ url_for('phone_catalog.phone_catalog_detail',brand=p.brand|lower|replace(' ','-'),slug=p.slug) }}">View</a>{% endif %}<form style="display:inline" method="post" action="{{ url_for('phone_catalog.delete_phone',phone_id=p.id) }}"><button type="submit">Delete</button></form></div></div>{% else %}<p>No phones yet. Add verified phone data before publishing.</p>{% endfor %}</body></html>
