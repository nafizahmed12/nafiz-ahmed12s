<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Admin Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='portfolio.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='portfolio-theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>.auth-wrap{max-width:520px;margin:70px auto;padding:34px}.auth-wrap form{display:grid;gap:14px}.auth-wrap input{width:100%;box-sizing:border-box}.flash{padding:12px 14px;border-radius:12px;margin-bottom:16px}</style>
</head>
<body>
<main class="section">
  <div class="glass-card auth-wrap">
    <span class="section-label">ADMIN RECOVERY</span>
    <h1>Set New Admin Password</h1>
    {% if error %}<div class="flash">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="token" value="{{ token }}">
      <input name="password" type="password" placeholder="New password" autocomplete="new-password" minlength="8" required>
      <input name="confirm_password" type="password" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>
      <button class="btn btn-primary" type="submit">Update Admin Password →</button>
    </form>
  </div>
</main>
</body>
</html>
