<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier Login</title><style>body{font-family:system-ui;max-width:520px;margin:60px auto;padding:20px}input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{cursor:pointer}.error{color:#b91c1c}.link{text-align:center;margin-top:16px}</style></head><body><h1>Supplier Login</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><input name="username" placeholder="Username or email" required><input name="password" type="password" placeholder="Password" required><button type="submit">Login</button></form><p class="link">New supplier? <a href="{{ url_for('supplier_register_page') }}">Create supplier account</a></p></body></html>
