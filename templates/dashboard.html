<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="section"><div class="section-heading"><span class="section-label">DASHBOARD</span><h1>Welcome, {{ username }}</h1><p>Create and manage your websites.</p></div><div class="glass-card" style="padding:28px;max-width:700px;margin:auto"><h2>Create Website</h2>{% if error %}<p>{{ error }}</p>{% endif %}<form method="post" action="{{ url_for('create_website_route') }}"><input name="name" placeholder="Website name" required><input name="slug" placeholder="unique-slug" pattern="[a-z0-9-]+" required><input name="title" placeholder="Website title" required><textarea name="content" placeholder="Website content" rows="6"></textarea><button class="btn btn-primary" type="submit">Create Website</button></form></div><div class="skills-grid" style="margin-top:30px">{% for site in websites %}<article class="glass-card skill-card" style="padding:24px"><h3>{{ site.name }}</h3><p>{{ site.title }}</p><a class="btn btn-secondary" href="{{ url_for('published_site', slug=site.slug) }}">View</a></article>{% else %}<p>No websites yet.</p>{% endfor %}</div><p><a href="{{ url_for('user_logout') }}">Logout</a></p></main></body></html>
