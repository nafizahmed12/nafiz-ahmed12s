<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} — Nafiz Store</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050816;color:#eef2ff;font-family:Inter,system-ui,-apple-system,sans-serif}.card{width:min(620px,calc(100% - 32px));padding:42px;border:1px solid #273252;border-radius:26px;background:rgba(15,22,42,.9);box-shadow:0 25px 80px #0008;text-align:center}.icon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 22px;font-size:34px;background:{{ icon_bg }};color:#fff}.eyebrow{font-size:12px;letter-spacing:2px;color:#8fa6ff;font-weight:800}.card h1{font-size:42px;margin:12px 0}.card p{color:#aab3cc;line-height:1.7}.actions{display:flex;justify-content:center;gap:12px;margin-top:28px;flex-wrap:wrap}.btn{display:inline-block;padding:13px 20px;border-radius:12px;text-decoration:none;font-weight:800;color:#fff;background:#171d32}.primary{background:linear-gradient(135deg,#7c5cff,#00c2ff)}
</style></head>
<body><main class="card"><div class="icon">{{ icon }}</div><div class="eyebrow">NAFIZ COMMERCE</div><h1>{{ title }}</h1><p>{{ message }}</p><div class="actions"><a class="btn primary" href="/shop">Back to Shop</a><a class="btn" href="/dashboard">My Account</a></div></main></body></html>
