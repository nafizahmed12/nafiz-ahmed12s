name: SEO Integrity

on:
  pull_request:
    paths:
      - 'seo/**'
      - 'scripts/validate_seo_registry.py'
      - 'static/*.html'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SEO registry
        run: python scripts/validate_seo_registry.py
