name: Apply security hardening

on:
  push:
    branches: [fix/logout-seo-hardening-2026-08]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe fixes
        shell: python
        run: |
          from pathlib import Path
          app = Path("app.py")
          text = app.read_text()
          old_block = '''def robots_txt():\n    content = """User-agent: *\nAllow: /\nDisallow: /admin\nDisallow: /login\nDisallow: /logout\nDisallow: /dashboard\nDisallow: /account\nDisallow: /register\nDisallow: /user-login\nDisallow: /user-logout\nDisallow: /forgot-password\nDisallow: /reset-password\n\nSitemap: https://nafiz-ahmed12s.onrender.com/sitemap.xml\n"""\n    return Response(content, mimetype="text/plain")'''
          new_block = '''def robots_txt():\n    site_url = os.getenv("PUBLIC_BASE_URL", "").strip().rstrip("/")\n    if not site_url:\n        site_url = request.url_root.rstrip("/")\n    content = f"""User-agent: *\nAllow: /\nDisallow: /admin\nDisallow: /login\nDisallow: /logout\nDisallow: /dashboard\nDisallow: /account\nDisallow: /register\nDisallow: /user-login\nDisallow: /user-logout\nDisallow: /forgot-password\nDisallow: /reset-password\n\nSitemap: {site_url}/sitemap.xml\n"""\n    return Response(content, mimetype="text/plain")'''
          if old_block not in text: raise SystemExit("robots_txt block not found")
          text = text.replace(old_block, new_block, 1)
          old_logout = '''@app.route("/user-logout")\ndef user_logout():\n    session.pop("user_id", None)\n    session.pop("username", None)\n    session.pop("_permanent", None)\n    flash("You have been logged out.", "success")\n    return redirect(url_for("user_login"))'''
          new_logout = '''@app.route("/user-logout", methods=["POST"])\ndef user_logout():\n    session.clear()\n    flash("You have been logged out.", "success")\n    return redirect(url_for("user_login"))'''
          if old_logout not in text: raise SystemExit("user_logout block not found")
          text = text.replace(old_logout, new_logout, 1)
          app.write_text(text)
          for name in ["templates/account.html", "templates/dashboard.html", "templates/seller_dashboard.html"]:
              p = Path(name)
              if not p.exists(): continue
              t = p.read_text()
              old = '<a class="btn btn-secondary" href="{{ url_for(\'user_logout\') }}">Logout</a>'
              new = '<form method="post" action="{{ url_for(\'user_logout\') }}" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-secondary" type="submit">Logout</button></form>'
              t = t.replace(old, new)
              old2 = '<a class="btn btn-primary" href="{{ url_for(\'user_logout\') }}">Logout</a>'
              new2 = '<form method="post" action="{{ url_for(\'user_logout\') }}" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-primary" type="submit">Logout</button></form>'
              t = t.replace(old2, new2)
              p.write_text(t)
          for p in Path("templates").rglob("*.html"):
              t = p.read_text()
              if "url_for('user_logout')" in t and 'method="post"' not in t:
                  raise SystemExit(f"Unconverted logout reference: {p}")
      - name: Verify changes
        run: |
          python -m py_compile app.py
          grep -F '@app.route("/user-logout", methods=["POST"])' app.py
          grep -F 'PUBLIC_BASE_URL' app.py
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-security-fix.yml
          git add app.py templates
          git commit -m "fix: make logout CSRF-protected and sitemap URL configurable"
          git push
