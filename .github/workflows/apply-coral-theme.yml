name: Apply Coral Market Theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-theme:
    if: github.event.head_commit.message != 'Apply Coral Market theme'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Coral Market palette
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/index.html')
          s = p.read_text()
          replacements = {
            '#030712':'#FFFFFF', '#07101f':'#FFF8F5', '#0b1628':'#FFFFFF', '#101d31':'#FFF8F5',
            '#38bdf8':'#FF6B5B', '#8b5cf6':'#FF8873', '#f8fafc':'#1A1A1A', '#b8c4d4':'#5C5C5C',
            '#8190a5':'#8A8A8A', '#000':'#1A1A1A', '#020617':'#1A1A1A', '#050b15':'#FFFFFF',
            '#10243a':'#FFEFE9', '#17294b':'#FFDCD3', '#13233a':'#FFEFE9', '#14233a':'#FFFFFF'
          }
          for a,b in replacements.items(): s = s.replace(a,b)
          s = s.replace('--blue:#FF6B5B;--purple:#FF8873;', '--coral:#FF6B5B;--coral2:#FF8873;')
          s = s.replace('theme-color" content="#FFFFFF"', 'theme-color" content="#1A1A1A"')
          p.write_text(s)
          PY
      - name: Commit theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.html
          git commit -m "Apply Coral Market theme" || exit 0
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/apply-coral-theme.yml || true
          git commit -m "Remove temporary theme workflow" || true
          git push || true
