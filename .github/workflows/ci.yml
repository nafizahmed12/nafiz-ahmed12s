name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Import application
        env:
          SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_test
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-password
          RENDER: '0'
        run: python -c "import app; print('Application import OK')"

      - name: Health smoke test
        env:
          SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_test
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-password
          RENDER: '0'
        run: |
          python - <<'PY'
          import app
          client = app.app.test_client()
          for path in ('/health', '/health/ready'):
              response = client.get(path)
              print(path, response.status_code, response.get_data(as_text=True))
              if response.status_code != 200:
                  raise SystemExit(1)
          PY

      - name: Validate Alembic migrations
        env:
          SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_test
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-password
          RENDER: '0'
        run: |
          python - <<'PY'
          from pathlib import Path
          from alembic.config import Config
          from alembic import command

          root = Path.cwd()
          config = Config(str(root / 'alembic.ini'))
          config.set_main_option('script_location', str(root / 'alembic'))
          command.upgrade(config, 'head')
          command.current(config, verbose=True)
          print('Alembic migrations apply successfully on PostgreSQL 16.')
          PY

      - name: Run regression tests
        env:
          SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_test
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-password
          RENDER: '0'
          PYTHONPATH: .
        run: python -m pytest -q
