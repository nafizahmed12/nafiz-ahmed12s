name: PostgreSQL Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

env:
  PGSSLMODE: require

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create compressed database backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          mkdir -p backup
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dump="backup/database-${timestamp}.dump"
          checksum="backup/database-${timestamp}.sha256"

          pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="$dump"

          test -s "$dump"
          sha256sum "$dump" > "$checksum"

      - name: Validate backup integrity
        run: |
          set -euo pipefail
          dump="$(find backup -name '*.dump' -type f -print -quit)"
          checksum="$(find backup -name '*.sha256' -type f -print -quit)"
          test -n "$dump"
          test -n "$checksum"
          sha256sum --check "$checksum"
          pg_restore --list "$dump" > backup/restore-manifest.txt
          test -s backup/restore-manifest.txt
          echo "Backup integrity validation passed."

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}
          path: backup/
          retention-days: 14
          if-no-files-found: error
