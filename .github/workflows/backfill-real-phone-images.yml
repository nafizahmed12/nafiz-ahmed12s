name: Backfill real phone catalog photos

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Write matched real photos to the production phone catalog (otherwise preview only)"
        required: true
        type: boolean
        default: false
      limit:
        description: "Optional maximum number of phones to check (0 = all)"
        required: true
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Find matching freely licensed phone photos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add DATABASE_URL as a GitHub Actions repository secret before running this workflow."
            exit 1
          fi

          args=()
          if [ "${{ inputs.limit }}" != "0" ]; then
            args+=(--limit "${{ inputs.limit }}")
          fi

          if [ "${{ inputs.apply_changes }}" = "true" ]; then
            python scripts/fetch_real_phone_images.py --apply "${args[@]}"
          else
            python scripts/fetch_real_phone_images.py --dry-run "${args[@]}"
          fi
