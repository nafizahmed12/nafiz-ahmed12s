name: Activate product page scale fix
on:
  push:
    branches: [fix/product-page-scale]
permissions:
  contents: write
jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject scale stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/product.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="/static/product-page-scale.css">'
          if link not in s:
              old = s
              s = s.replace('</head>', link + '</head>', 1)
              if s == old:
                  raise SystemExit('Could not find </head>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/product.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate product page scale stylesheet'
          git push